version: 2
project_name: mockit

builds:
  - id: mockit
    main: .
    binary: mockit
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    flags:
      - -trimpath

archives:
  - id: binaries
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS.txt"

release:
  extra_files:
    - glob: ./INSTALL.md
    - glob: ./AGENT-GUIDE.md
    - glob: ./skills/mockit/SKILL.md
