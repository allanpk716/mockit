<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>mockit · 提交详情</title>
<style>
:root{
  --bg:#0e1116; --surface:#171b22; --surface2:#1f242e; --border:#2a303c;
  --text:#e8eaee; --dim:#9aa3b2; --accent:#4f8cff; --chip:#2a3342;
  --ok:#3fbf72; --bad:#e2564e; --pin:#f5c451;
}
*{box-sizing:border-box}
/* hidden 兜底:作者样式(如 #x{display:flex})优先级高于 UA 的 [hidden]{display:none},会让 hidden 失效 */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.back{
  display:inline-block;margin:12px 16px 0;color:var(--dim);font-size:14px;
  padding:4px 0;
}
.wrap{padding:6px 16px 32px}
h1{font-size:19px;margin:6px 0 10px;word-break:break-all}
.metaline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid transparent;flex:none}
.s-pending{background:rgba(245,196,81,.14);color:#f5c451;border-color:rgba(245,196,81,.4)}
.s-reviewed{background:var(--chip);color:var(--dim);border-color:var(--border)}
.b-approve{background:rgba(63,191,114,.14);color:var(--ok);border-color:rgba(63,191,114,.4)}
.b-reject{background:rgba(226,86,78,.14);color:var(--bad);border-color:rgba(226,86,78,.4)}
.b-choose{background:rgba(79,140,255,.14);color:var(--accent);border-color:rgba(79,140,255,.4)}
.time{color:var(--dim);font-size:12px}
#pin{
  margin-left:auto;background:var(--surface2);border:1px solid var(--border);
  color:var(--dim);border-radius:8px;padding:7px 12px;font-size:13px;user-select:none;
}
#pin.on{color:var(--pin);border-color:var(--pin);background:rgba(245,196,81,.12)}
.note{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;margin:14px 0 0;font-size:14px;color:var(--text);
  white-space:pre-wrap;word-break:break-all;
}
.verdict{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin:14px 0 0;
}
.verdict-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict-label{color:var(--dim);font-size:13px}
.comment{margin-top:8px;font-size:14px;white-space:pre-wrap;word-break:break-all}
h2{font-size:14px;font-weight:600;color:var(--dim);margin:22px 0 4px;letter-spacing:1px}
.vrow{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin:10px 0;
}
.vmain{flex:1;min-width:0}
.vtitle{font-weight:600;word-break:break-all}
.vmeta{display:flex;gap:8px;align-items:center;margin-top:5px;color:var(--dim);font-size:12px}
.kind{background:var(--chip);border-radius:999px;padding:1px 8px}
.enter{
  flex:none;display:inline-block;background:var(--accent);color:#fff;border:0;
  border-radius:8px;padding:9px 16px;font-weight:600;text-align:center;user-select:none;
}
.enter:active{opacity:.85}
.enter[disabled]{
  background:var(--surface2);color:var(--dim);border:1px solid var(--border);
  font-weight:400;
}
#msg{padding:48px 24px;text-align:center;color:var(--dim)}
#toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;border-radius:8px;
  padding:8px 14px;font-size:14px;pointer-events:none;
}
</style>
</head>
<body data-page="detail">
<a class="back" href="/">‹ 列表</a>
<main class="wrap" id="app" hidden>
  <h1 id="title"></h1>
  <div class="metaline">
    <span id="status" class="badge"></span>
    <span class="time" id="time"></span>
    <button type="button" id="pin">钉住</button>
  </div>
  <div id="note" class="note" hidden></div>
  <div id="verdict" class="verdict" hidden>
    <div class="verdict-line">
      <span class="verdict-label">裁决</span>
      <span id="decision" class="badge"></span>
    </div>
    <div id="comment" class="comment" hidden></div>
  </div>
  <h2>候选</h2>
  <div id="variants"></div>
</main>
<div id="msg" hidden></div>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var m = location.pathname.match(/^\/s\/([0-9a-z]{6})\/?$/);
var id = m ? m[1] : '';
var sub = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtTime(sec){
  if(!sec) return '';
  var d = new Date(sec * 1000);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function decisionText(s){
  if(s.decision === 'approve') return '通过';
  if(s.decision === 'reject') return '打回';
  if(s.decision === 'choose'){
    var label = '', vs = s.variants || [];
    for(var i = 0; i < vs.length; i++){
      if(vs[i].seq === s.chosen_variant){ label = vs[i].label; break; }
    }
    return '选中 候选 ' + s.chosen_variant + '·' + label;
  }
  return '已审';
}
function fail(msg){
  $('app').hidden = true;
  var el = $('msg');
  el.textContent = msg;
  el.hidden = false;
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  setTimeout(function(){ t.hidden = true; }, 1800);
}

function render(s){
  sub = s;
  document.title = 'mockit · ' + (s.title || s.id);
  $('title').textContent = s.title || '(无标题)';
  var st = $('status');
  if(s.status === 'pending'){ st.textContent = '待审'; st.className = 'badge s-pending'; }
  else { st.textContent = '已审'; st.className = 'badge s-reviewed'; }
  $('time').textContent = '提交于 ' + fmtTime(s.created_at);

  var pin = $('pin');
  pin.textContent = s.pinned ? '已钉' : '钉住';
  pin.className = s.pinned ? 'on' : '';

  if(s.note){
    $('note').textContent = s.note;
    $('note').hidden = false;
  }
  if(s.status === 'reviewed'){
    var d = $('decision');
    d.textContent = decisionText(s);
    d.className = 'badge b-' + s.decision;
    if(s.comment){
      $('comment').textContent = '批注:' + s.comment;
      $('comment').hidden = false;
    }
    $('verdict').hidden = false;
  }

  var vs = s.variants || [], html = '';
  for(var i = 0; i < vs.length; i++){
    var v = vs[i];
    var enter = v.cleaned
      ? '<button type="button" class="enter" disabled>页面已清理</button>'
      : '<a class="enter" href="/s/' + id + '/v' + v.seq + '">进入</a>';
    html += '<div class="vrow">'
      + '<div class="vmain">'
      + '<div class="vtitle">候选 ' + v.seq + ' · ' + esc(v.label) + '</div>'
      + '<div class="vmeta"><span class="kind">' + esc(v.kind) + '</span></div>'
      + '</div>' + enter + '</div>';
  }
  $('variants').innerHTML = html;
  $('app').hidden = false;
}

function togglePin(){
  if(!sub) return;
  var pin = $('pin');
  pin.disabled = true;
  fetch('/api/pin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id: id, pinned: !sub.pinned })
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(updated){
    pin.disabled = false;
    render(updated);   // 用返回的最新状态刷新页面
  }).catch(function(){
    pin.disabled = false;
    toast('操作失败,请重试');
  });
}
$('pin').addEventListener('click', togglePin);

if(!m){
  fail('链接不合法');
} else {
  fetch('/api/submissions/' + id)
    .then(function(r){
      if(r.status === 404) throw new Error('提交不存在(可能已过保留期)');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(function(err){ fail('加载失败: ' + err.message); });
}
})();
</script>
</body>
</html>
