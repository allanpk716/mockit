<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>mockit · 提交列表</title>
<style>
:root{
  --bg:#0e1116; --surface:#171b22; --surface2:#1f242e; --border:#2a303c;
  --text:#e8eaee; --dim:#9aa3b2; --accent:#4f8cff; --chip:#2a3342;
  --ok:#3fbf72; --bad:#e2564e; --pin:#f5c451;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.top{
  display:flex;align-items:baseline;gap:8px;
  padding:14px 16px 4px;
}
.brand{font-size:20px;font-weight:700;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13px}
h2{
  margin:18px 16px 2px;font-size:14px;font-weight:600;color:var(--dim);
  letter-spacing:1px;
}
.card{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;margin:10px 12px;
}
.card:active{background:var(--surface2)}
.card-main{flex:1;min-width:0}
.card-title{font-weight:600;word-break:break-all}
.card-meta{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;flex:none}
.pin{
  flex:none;background:var(--surface2);border:1px solid var(--border);
  color:var(--dim);border-radius:8px;padding:8px 10px;font-size:13px;
  user-select:none;
}
.pin.on{color:var(--pin);border-color:var(--pin);background:rgba(245,196,81,.12)}
.badge{border-radius:999px;padding:2px 10px;font-size:12px;flex:none;border:1px solid transparent}
.b-approve{background:rgba(63,191,114,.14);color:var(--ok);border-color:rgba(63,191,114,.4)}
.b-reject{background:rgba(226,86,78,.14);color:var(--bad);border-color:rgba(226,86,78,.4)}
.b-choose{background:rgba(79,140,255,.14);color:var(--accent);border-color:rgba(79,140,255,.4)}
.badge:not([class*=" b-"]){background:var(--chip);color:var(--dim)}
.row{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;margin:0 0;border-bottom:1px solid var(--border);
}
.row:active{background:var(--surface)}
.row-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{color:var(--dim);font-size:12px;flex:none}
#reviewed-list{margin-top:4px;border-top:1px solid var(--border)}
details{margin-top:2px}
summary{
  cursor:pointer;list-style:none;
  margin:18px 16px 2px;font-size:14px;font-weight:600;color:var(--dim);
  letter-spacing:1px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:" ›";color:var(--dim)}
details[open] summary::after{content:" ⌄"}
#empty{padding:64px 24px;text-align:center;color:var(--dim)}
#empty .empty-title{font-size:17px;color:var(--text);margin:0 0 8px}
#empty .empty-hint{font-size:14px;margin:0}
#toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:rgba(0,0,0,.82);color:#fff;border-radius:8px;
  padding:8px 14px;font-size:14px;pointer-events:none;
}
</style>
</head>
<body data-page="list">
<header class="top"><span class="brand">mockit</span><span class="sub">提交列表</span></header>
<main id="app">
  <h2 id="pending-summary" hidden>待审</h2>
  <div id="pending-list"></div>

  <details id="reviewed-sec" hidden>
    <summary id="reviewed-summary">已审</summary>
    <div id="reviewed-list"></div>
  </details>

  <div id="empty" hidden>
    <p class="empty-title">还没有提交</p>
    <p class="empty-hint">agent 用 mockit_submit 提交候选后,待审卡片会出现在这里。</p>
  </div>
</main>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var byId = {};   // id → 提交对象(pin 切换时用)
var busy = false;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtTime(sec){
  if(!sec) return '';
  var d = new Date(sec * 1000);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function decisionText(s){
  if(s.decision === 'approve') return '通过';
  if(s.decision === 'reject') return '打回';
  if(s.decision === 'choose'){
    var label = '', vs = s.variants || [];
    for(var i = 0; i < vs.length; i++){
      if(vs[i].seq === s.chosen_variant){ label = vs[i].label; break; }
    }
    return '选中 ' + s.chosen_variant + '·' + label;
  }
  return '已审';
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  setTimeout(function(){ t.hidden = true; }, 1800);
}

function cardHTML(s){
  return '<div class="card" data-id="' + esc(s.id) + '">'
    + '<div class="card-main">'
    + '<div class="card-title">' + esc(s.title || '(无标题)') + '</div>'
    + '<div class="card-meta"><span class="chip">候选 ' + (s.variants || []).length + '</span>'
    + '<span>' + fmtTime(s.created_at) + '</span></div>'
    + '</div>'
    + '<button type="button" class="pin' + (s.pinned ? ' on' : '') + '" data-pin="' + esc(s.id) + '">'
    + (s.pinned ? '已钉' : '钉住') + '</button>'
    + '</div>';
}
function rowHTML(s){
  return '<a class="row" href="/s/' + esc(s.id) + '">'
    + '<span class="row-title">' + esc(s.title || '(无标题)') + '</span>'
    + '<span class="badge b-' + esc(s.decision) + '">' + esc(decisionText(s)) + '</span>'
    + '<span class="time">' + fmtTime(s.reviewed_at || s.created_at) + '</span>'
    + '</a>';
}

function render(items){
  var pend = [], rev = [];
  byId = {};
  for(var i = 0; i < items.length; i++){
    byId[items[i].id] = items[i];
    (items[i].status === 'pending' ? pend : rev).push(items[i]);
  }
  $('pending-summary').hidden = pend.length === 0;
  $('pending-summary').textContent = '待审 · ' + pend.length;
  $('pending-list').innerHTML = pend.map(cardHTML).join('');
  $('reviewed-sec').hidden = rev.length === 0;
  $('reviewed-summary').textContent = '已审 · ' + rev.length;
  $('reviewed-list').innerHTML = rev.map(rowHTML).join('');
  $('empty').hidden = items.length !== 0;
}

function load(){
  return fetch('/api/submissions')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(items){ render(items || []); busy = false; })
    .catch(function(){
      $('empty').hidden = false;
      $('empty').innerHTML = '<p class="empty-title">加载失败</p><p class="empty-hint"><a href="/">点此重试</a></p>';
      busy = false;
    });
}

function togglePin(id, btn){
  var s = byId[id];
  if(!s || busy) return;
  busy = true;
  btn.disabled = true;
  fetch('/api/pin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id: id, pinned: !s.pinned })
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return load();  // 重拉重渲,等价刷新
  }).catch(function(){
    btn.disabled = false;
    busy = false;
    toast('操作失败,请重试');
  });
}

document.addEventListener('click', function(e){
  var pin = e.target.closest('[data-pin]');
  if(pin){ togglePin(pin.getAttribute('data-pin'), pin); return; }
  var card = e.target.closest('.card[data-id]');
  if(card){ location.href = '/s/' + card.getAttribute('data-id'); }
});

load();
})();
</script>
</body>
</html>
