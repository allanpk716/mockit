<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>mockit · 候选</title>
<style>
:root{
  --bg:#0e1116; --surface:#171b22; --surface2:#1f242e; --border:#2a303c;
  --text:#e8eaee; --dim:#9aa3b2; --accent:#4f8cff; --chip:#2a3342;
  --ok:#3fbf72; --bad:#e2564e;
  --bar-h:104px; /* JS 按 #bar 实测高度覆写 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
/* 兜底:带 hidden 属性的元素一律不显示,优先级压过自身 display 样式
   (#stage-msg 的 flex 曾盖住整页候选,诊断见原 feedback/2026-10-10-variant-page-blank-overlay.md) */
[hidden]{display:none!important}
/* 全屏舞台:高度 = 视口 - 悬浮条实测高度,iframe 不被悬浮条遮挡 */
#stage{position:fixed;top:0;left:0;right:0;bottom:var(--bar-h)}
#frame{width:100%;height:100%;border:0;display:block;background:#fff}
#stage-msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);background:var(--bg);padding:24px;text-align:center;font-size:15px;
}
/* 底部悬浮条:只留候选圆点与两个裁决按钮,尽量不遮挡候选 */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--surface);border-top:1px solid var(--border);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
#pills{display:flex;gap:8px;overflow-x:auto;padding:2px;margin-bottom:8px}
.pill{
  flex:none;min-width:34px;height:32px;padding:0 8px;
  display:flex;align-items:center;justify-content:center;
  border-radius:999px;background:var(--surface2);border:1px solid var(--border);
  color:var(--dim);font-size:14px;user-select:none;
}
.pill.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bar-row{display:flex;gap:8px;align-items:center}
.btn{
  flex:1;border:0;border-radius:8px;padding:10px 16px;font-weight:600;user-select:none;
}
.btn:active{opacity:.85}
#btn-primary{background:var(--accent);color:#fff}
#btn-reject{background:rgba(226,86,78,.16);color:var(--bad);border:1px solid rgba(226,86,78,.4)}
.btn[disabled]{opacity:.45;cursor:default}
#note-chip{color:var(--dim);font-size:12px;margin-top:6px;word-break:break-all}
/* 底部批注面板:点任一裁决按钮弹出,给多行批注足够空间 */
#panel-backdrop{
  position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);
}
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:21;
  background:var(--surface);border:1px solid var(--border);border-bottom:0;
  border-radius:14px 14px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
}
#panel h2{font-size:16px;margin:0 0 2px}
#panel-hint{color:var(--dim);font-size:13px;margin:0 0 8px}
#panel textarea{
  width:100%;min-height:132px;resize:vertical;font-size:16px; /* 防 iOS 聚焦缩放 */
  font-family:inherit;line-height:1.45;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:9px 10px;
}
#panel textarea::placeholder{color:var(--dim)}
#panel textarea:focus{outline:none;border-color:var(--accent)}
.panel-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
#count{color:var(--dim);font-size:12px;flex:none}
#err{color:var(--bad);font-size:13px;word-break:break-all;flex:1;min-width:0;text-align:right}
.panel-row{display:flex;gap:8px;margin-top:10px}
#panel-cancel{background:var(--surface2);color:var(--dim);border:1px solid var(--border)}
#panel-ok{background:var(--accent);color:#fff}
</style>
</head>
<body data-page="variant">
<div id="stage">
  <iframe id="frame" title="候选页面"></iframe>
  <div id="stage-msg" hidden></div>
</div>

<div id="bar">
  <div id="pills"></div>
  <div class="bar-row">
    <button type="button" id="btn-primary" class="btn">通过</button>
    <button type="button" id="btn-reject" class="btn">打回</button>
  </div>
  <div id="note-chip" hidden></div>
</div>

<div id="panel-backdrop" hidden></div>
<div id="panel" hidden role="dialog" aria-label="裁决批注">
  <h2 id="panel-title"></h2>
  <p id="panel-hint"></p>
  <textarea id="comment" maxlength="2000" placeholder="批注(打回必填)" autocomplete="off"></textarea>
  <div class="panel-meta">
    <span id="count"></span>
    <span id="err" hidden></span>
  </div>
  <div class="panel-row">
    <button type="button" id="panel-cancel" class="btn">取消</button>
    <button type="button" id="panel-ok" class="btn">确认</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var m = location.pathname.match(/^\/s\/([0-9a-z]{6})\/v(\d+)$/);
var id = m ? m[1] : '';
var n = m ? parseInt(m[2], 10) : 0;
var sub = null;
var multi = false;
var busy = false;
var panelDecision = '';
/* 批注上限 2000 字,按字符计(非字节),与服务端 /api/review 校验一致 */
var MAX_COMMENT = 2000;
/* 已审态底栏摘要的批注截断长度(约 60 字),全文在详情页展示 */
var SUMMARY_LEN = 60;

function fail(msg){
  $('frame').style.display = 'none';
  var el = $('stage-msg');
  el.textContent = msg;
  el.hidden = false;
  $('bar').hidden = true;
  fitBar();
}
function showErr(msg){
  var e = $('err');
  e.textContent = msg;
  e.hidden = false;
}
function hideErr(){ $('err').hidden = true; }
function decisionText(s){
  if(s.decision === 'approve') return '通过';
  if(s.decision === 'reject') return '打回';
  if(s.decision === 'choose'){
    var label = '', vs = s.variants || [];
    for(var i = 0; i < vs.length; i++){
      if(vs[i].seq === s.chosen_variant){ label = vs[i].label; break; }
    }
    return '选中 候选 ' + s.chosen_variant + '·' + label;
  }
  return '已审';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* 按字符数计(码点),与服务端按 rune 计一致 */
function charCount(s){
  return Array.from(String(s == null ? '' : s)).length;
}
function truncate(s, len){
  var cs = Array.from(String(s == null ? '' : s));
  return cs.length > len ? cs.slice(0, len).join('') + '…' : s;
}

/* 悬浮条高度变化时同步舞台底边,保证 iframe 底部留白、内容不被遮挡 */
function fitBar(){
  var bar = $('bar');
  if(bar.hidden) return;
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
}

function init(){
  var vs = sub.variants || [];
  var cur = null, ph = '';
  for(var i = 0; i < vs.length; i++){
    var v = vs[i];
    if(v.seq === n) cur = v;
    ph += '<a class="pill' + (v.seq === n ? ' cur' : '') + '" href="/s/' + id + '/v' + v.seq + '" title="' + esc(v.label) + '">' + v.seq + '</a>';
  }
  $('pills').innerHTML = ph;
  if(!cur){ fail('候选 ' + n + ' 不存在'); return; }

  $('frame').src = '/raw/' + id + '/' + n + '/index.html';

  /* 分支:多候选=选它(choose+候选序号) / 单候选=通过(approve) */
  multi = vs.length > 1;
  $('bar').dataset.mode = multi ? 'multi' : 'single';
  $('btn-primary').textContent = multi ? '选它' : '通过';

  if(sub.status === 'reviewed'){
    /* 终态:按钮停用,底栏只显摘要(批注截断约 60 字,详情页看全文) */
    $('btn-primary').disabled = true;
    $('btn-reject').disabled = true;
    var chip = $('note-chip');
    chip.textContent = '已审 · ' + decisionText(sub) + (sub.comment ? ' · 批注:' + truncate(sub.comment, 60) : '');
    chip.hidden = false;
  }
  fitBar();
}

/* ---- 底部批注面板 ---- */

/* ---- 批注草稿(票 07):按提交 id 存手机浏览器本地存储 ----
 同一提交所有候选页共用一份(键含 id),切候选/刷新/误关后回来都在;
 输入实时保存,裁决成功后清除、失败保留。私有模式/被禁时 localStorage
 访问可能抛错,读写一律 try/catch 兜底:存不上只是退化为本次会话内保留,
 不阻拦裁决动线。 */
var DRAFT_PREFIX = 'mockit.draft.';
var draftKey = DRAFT_PREFIX + id;
function loadDraft(){
  try{ return localStorage.getItem(draftKey) || ''; }catch(e){ return ''; }
}
function saveDraft(v){
  try{ localStorage.setItem(draftKey, v); }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(draftKey); }catch(e){}
}

function updateCount(){
  var left = MAX_COMMENT - charCount($('comment').value);
  var c = $('count');
  c.textContent = '还可写 ' + left + ' 字';
  c.style.color = left <= 100 ? 'var(--bad)' : '';
}

function openPanel(decision){
  if(busy || !sub || sub.status === 'reviewed') return;
  panelDecision = decision;
  var isReject = decision === 'reject';
  var primary = multi ? '选它' : '通过';
  $('panel-title').textContent = isReject ? '打回' : primary;
  $('panel-hint').textContent = isReject
    ? '说明哪里不行、往哪改;批注必填'
    : '批注可写可不写,可顺带补充“选这个但把 X 改一下”';
  $('panel-ok').textContent = isReject ? '确认打回' : '确认' + primary;
  hideErr();
  updateCount();
  /* 取消/关闭不清空批注框;草稿在页面加载时已按提交 id 从本地存储恢复
     (见下方 loadDraft),写到一半回到候选再打开仍在 */
  $('panel-backdrop').hidden = false;
  $('panel').hidden = false;
  $('comment').focus();
}
function closePanel(){
  $('panel').hidden = true;
  $('panel-backdrop').hidden = true;
}

function setBusy(b){
  busy = b;
  $('panel-ok').disabled = b;
  $('panel-cancel').disabled = b;
}

function confirmPanel(){
  if(busy || !sub || sub.status === 'reviewed') return;
  var comment = $('comment').value.trim();
  if(panelDecision === 'reject' && comment === ''){
    showErr('打回必须写批注,说明哪里不行、往哪改'); /* 前端拦截,服务端兜底 400 */
    return;
  }
  setBusy(true);
  hideErr();
  var body = { id: id, decision: panelDecision, comment: comment };
  if(panelDecision === 'choose') body.variant = n; /* choose 必须携带候选序号 */
  fetch('/api/review', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){ return { ok: r.ok, j: j }; });
  }).then(function(res){
    if(res.ok){ clearDraft(); location.href = '/s/' + id; return; } /* 成功 → 清草稿,回详情页;失败不清,批注不丢 */
    setBusy(false);
    showErr('提交失败: ' + ((res.j && res.j.error) ? res.j.error : '未知错误')); /* 如已审(409)面板内就地显示,批注不丢 */
  }).catch(function(err){
    setBusy(false);
    showErr('提交失败: ' + err.message);
  });
}

$('btn-primary').addEventListener('click', function(){ openPanel(multi ? 'choose' : 'approve'); });
$('btn-reject').addEventListener('click', function(){ openPanel('reject'); });
$('panel-ok').addEventListener('click', confirmPanel);
$('panel-cancel').addEventListener('click', closePanel);
$('panel-backdrop').addEventListener('click', closePanel);
$('comment').addEventListener('input', function(){
  updateCount();
  saveDraft($('comment').value); /* 实时存草稿:切候选/刷新/误关浏览器都不丢 */
});

/* 页面加载即恢复该提交的草稿:面板打开时批注框里已是写到一半的内容 */
$('comment').value = loadDraft();
updateCount();

window.addEventListener('resize', fitBar);
window.addEventListener('load', fitBar);

if(!m){
  fail('链接不合法');
} else {
  fetch('/api/submissions/' + id)
    .then(function(r){
      if(r.status === 404) throw new Error('提交不存在(可能已过保留期)');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(s){ sub = s; init(); })
    .catch(function(err){ fail('加载失败: ' + err.message); });
}
fitBar();
})();
</script>
</body>
</html>
